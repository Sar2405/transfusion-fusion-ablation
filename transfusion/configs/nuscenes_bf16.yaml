# TransFusion nuScenes configuration
# Matches paper settings (Table 1, nuScenes val set)

model:
  bev_in_channels: 64         # PillarFeatureNet output (pillar feature dim)
  point_feat_channels: 4      # raw point dims: 4 (single-sweep) or 5 (+Δt for sweeping)
  num_cameras: 6
  num_classes: 10
  num_queries: 200
  d_model: 256
  nhead: 8
  num_lidar_decoder_layers: 1
  num_fusion_decoder_layers: 1
  dropout: 0.1
  pc_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]
  voxel_size: [0.2, 0.2, 8.0]
  out_size_factor: 4          # BEV feature stride vs voxel grid
  fusion_mode: "full"         # "full" | "cls_only" | "dual_stream" (3-way ablation)

backbone:
  lidar:
    type: "SecondBackbone"    # SECOND-style 2D backbone (post-voxelisation)
    in_channels: 64
    layer_nums: [5, 5]
    layer_strides: [1, 2]
    num_filters: [128, 256]
    upsample_strides: [1, 2]
    num_upsample_filters: [256, 256]
  image:
    type: "ResNet50"
    pretrained: "torchvision://resnet50"
    frozen_stages: 1
    fpn:
      in_channels: [512, 1024, 2048]
      out_channels: 256
      num_outs: 3

data:
  dataset: "nuScenes"
  root: "/data/nuscenes"
  version: "v1.0-trainval"
  point_cloud_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]
  voxel_size: [0.2, 0.2, 8.0]
  max_points_per_voxel: 10
  cbgs: true     # class-balanced sampling (paper: yes)
  max_voxels_train: 30000
  max_voxels_test: 60000
  img_size: [448, 800]          # H x W per camera
  class_names:
    - car
    - truck
    - construction_vehicle
    - bus
    - trailer
    - barrier
    - motorcycle
    - bicycle
    - pedestrian
    - traffic_cone
  augmentation:
    train:
      global_rotation_noise: [-0.3925, 0.3925]
      global_scale_noise: [0.95, 1.05]
      flip_ratio: 0.5
      img_flip: true
      img_color_jitter:
        brightness: 0.4
        contrast: 0.4
        saturation: 0.4
        hue: 0.1

loss:
  heatmap_weight: 1.0
  cls_weight: 1.0
  bbox_weight: 0.25
  aux_loss: true              # stage-1 auxiliary loss
  aux_weight: 0.5
  focal_alpha: 0.25
  focal_gamma: 2.0
  gaussian_overlap: 0.1
  min_radius: 2
  cost_class_w: 0.15
  cost_bbox_w:  0.25
  cost_iou_w:   0.25
  dim_order:    "lw"
  iou_mode:     "nearest"

training:
  epochs: 20
  batch_size: 4               # per GPU
  num_workers: 4
  grad_clip: 0.1
  optimizer:
    type: "AdamW"
    lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
  scheduler:
    type: "OneCycleLR"
    max_lr: 3.5e-4
    pct_start: 0.4
    div_factor: 10.0
    final_div_factor: 100.0
  amp: true                   # automatic mixed precision
  amp_dtype: bf16
  sync_bn: true               # for multi-GPU

evaluation:
  interval: 5                 # evaluate every N epochs
  nms_iou_threshold: 0.2
  score_threshold: 0.1
  max_per_scene: 500
